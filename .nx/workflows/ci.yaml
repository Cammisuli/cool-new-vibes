triggers:
  pull-requests:
    event: PR
    branches: ['main']
  pushes:
    event: PUSH
    branches: ['main']

workflows:
  main:
    runs-on: linux-medium-js
    steps:
      - name: Install Playwright browsers
        script: |
          npx playwright install --with-deps

      - name: Run affected tasks
        script: |
          npx nx affected -t lint typecheck test build
